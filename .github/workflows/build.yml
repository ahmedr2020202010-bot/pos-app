name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check main.dart
        run: |
          if ! head -1 main.dart | grep -q "import 'dart:convert'"; then
            echo "ERROR: main.dart does not contain the app code (first line should be: import 'dart:convert';)"
            echo "First line is: $(head -1 main.dart)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project and add our code
        run: |
          flutter create --org com.pos --project-name pos_app --platforms android app
          cp main.dart app/lib/main.dart
          cd app
          flutter pub add google_mlkit_text_recognition permission_handler pdf excel "archive:^3.6.1" share_plus image syncfusion_flutter_pdf url_launcher
          sed -i 's|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i -E 's/^( *)compileSdk *=.*/\1compileSdk = 37/' android/app/build.gradle.kts
          grep -n "compileSdk" android/app/build.gradle.kts
          echo '-dontwarn com.google.mlkit.vision.text.**' > android/app/proguard-rules.pro
          sed -i 's|signingConfig = signingConfigs.getByName("debug")|&\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")|' android/app/build.gradle.kts
          grep -n "proguard" android/app/build.gradle.kts
          rm -rf test

      - name: Gradle - also resolve plugins from Maven Central
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/repos.gradle <<'EOG'
          gradle.beforeSettings { settings ->
            settings.pluginManagement {
              repositories {
                mavenCentral()
                google()
                gradlePluginPortal()
              }
            }
          }
          gradle.allprojects { project ->
            project.buildscript.repositories {
              mavenCentral()
              google()
            }
          }
          EOG

      - name: Build APK
        run: |
          cd app
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: pos-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
